name: Pages

# Every push builds with --strict (a broken internal link fails the run);
# only main deploys. GitHub Pages is artifact-based by design: the build job
# uploads, the deploy job publishes, and the two never share a runner.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  # Not cancel-in-progress: cancelling a half-finished Pages deployment
  # leaves the site on whichever version happened to land first.
  group: pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The revision-date plugin reads git history; a shallow clone makes
          # every page claim it was written at build time.
          fetch-depth: 0

      - uses: astral-sh/setup-uv@e92bafb6253dcd438e0484186d7669ea7a8ca1cc # v6.4.3

      - name: install
        run: |
          uv venv
          uv pip install -r requirements.txt

      - name: build, strict
        run: .venv/bin/mkdocs build --strict

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    # A pull request from a fork must never publish. Deploy is main-only.
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
